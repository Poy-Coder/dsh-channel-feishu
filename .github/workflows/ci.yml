name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Flat node_modules: the same layout the published bundle is installed with.
      - run: pnpm install --node-linker=hoisted --no-frozen-lockfile
      # Every hermetic test file runs, so a new one gates the release without
      # this workflow needing an edit. `*-probe.mjs` files talk to the live
      # Feishu tenant and need credentials, so they are skipped here.
      - name: tests
        run: |
          set -e
          for file in test/*.mjs; do
            case "$file" in
              *-probe.mjs)
                echo "== skip $file (live probe, needs credentials)"
                continue
                ;;
            esac
            echo "== $file"
            node "$file"
          done
